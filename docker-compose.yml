services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hamoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamoon}
      POSTGRES_DB: ${POSTGRES_DB:-hamoon}
    ports:
      - "5432:5432"
    volumes:
      - hamoon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hamoon} -d ${POSTGRES_DB:-hamoon}"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - hamoon_nats:/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"
    volumes:
      - ./infra/identity/hamoon-realm.json:/opt/keycloak/data/import/hamoon-realm.json:ro

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hamoon_minio:/data

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hamoon}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-hamoon}
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

volumes:
  hamoon_postgres:
  hamoon_nats:
  hamoon_minio:
