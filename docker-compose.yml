services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hamoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamoon}
      POSTGRES_DB: ${POSTGRES_DB:-hamoon}
    ports:
      - "5432:5432"
    volumes:
      - hamoon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hamoon} -d ${POSTGRES_DB:-hamoon}"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - hamoon_nats:/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"
    volumes:
      - ./infra/identity/hamoon-realm.json:/opt/keycloak/data/import/hamoon-local-realm.json:ro

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hamoon_minio:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done;
      mc mb --ignore-existing local/hamoon-evidence;
      mc mb --ignore-existing local/hamoon-evidence-quarantine;
      mc mb --ignore-existing local/hamoon-derived-artifacts;
      mc anonymous set none local/hamoon-evidence;
      mc anonymous set none local/hamoon-evidence-quarantine;
      mc anonymous set none local/hamoon-derived-artifacts;
      "

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hamoon}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-hamoon}
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      HAMOON_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hamoon}:${POSTGRES_PASSWORD:-hamoon}@postgres:5432/${POSTGRES_DB:-hamoon}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "hamoon.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HAMOON_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hamoon}:${POSTGRES_PASSWORD:-hamoon}@postgres:5432/${POSTGRES_DB:-hamoon}
      HAMOON_NATS_URL: nats://nats:4222
      HAMOON_TEMPORAL_ADDRESS: temporal:7233
      HAMOON_OIDC_ISSUER_URL: http://localhost:8081/realms/hamoon-local
      HAMOON_OIDC_JWKS_URL: http://keycloak:8080/realms/hamoon-local/protocol/openid-connect/certs
      HAMOON_EVIDENCE_LOCAL_ROOT: /data/evidence
      HAMOON_OTEL_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - hamoon_evidence:/data/evidence

  outbox-worker:
    build: .
    command: ["python", "-m", "hamoon.infrastructure.events.outbox"]
    restart: unless-stopped
    environment:
      HAMOON_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hamoon}:${POSTGRES_PASSWORD:-hamoon}@postgres:5432/${POSTGRES_DB:-hamoon}
      HAMOON_NATS_URL: nats://nats:4222
      HAMOON_OTEL_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

  temporal-worker:
    build: .
    command: ["python", "-m", "hamoon.infrastructure.temporal.worker"]
    restart: unless-stopped
    environment:
      HAMOON_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hamoon}:${POSTGRES_PASSWORD:-hamoon}@postgres:5432/${POSTGRES_DB:-hamoon}
      HAMOON_TEMPORAL_ADDRESS: temporal:7233
      HAMOON_OTEL_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

volumes:
  hamoon_postgres:
  hamoon_nats:
  hamoon_minio:
  hamoon_evidence:
