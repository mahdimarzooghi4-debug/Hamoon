[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hamoon"
version = "0.1.0"
description = "Hamoon — AI-first household empowerment decision and learning system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "nats-py>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "jsonschema>=4.23,<5.0",
  "temporalio>=1.9,<2.0",
  "opentelemetry-api>=1.44,<2.0",
  "opentelemetry-sdk>=1.44,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.65b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1.0",
  "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
  "pyright>=1.1,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hamoon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/hamoon/app/api/routes/health.py" = ["B008"]
"src/hamoon/domains/pgor/domain/definitions.py" = ["E741"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
