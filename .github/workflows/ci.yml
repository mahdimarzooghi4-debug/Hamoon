name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Frontend type check
        run: npm --prefix frontend run typecheck

      - name: Frontend access policy tests
        run: npm --prefix frontend run test:access

      - name: Frontend build
        run: npm --prefix frontend run build

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright src

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Contract tests
        run: uv run pytest tests/contract

      - name: Security regression gate
        run: |
          uv run pytest tests/unit/security
          uv run pytest tests/unit/provider_result/test_provider_result.py

      - name: Production configuration safety gate
        run: uv run pytest tests/unit/config/test_settings.py

      - name: Alert and runbook contract gate
        run: uv run python scripts/verify_alert_contract.py ops/observability/alert-policy.json .

      - name: Prometheus alert rule materialization gate
        run: |
          uv run python scripts/verify_prometheus_alert_rules.py \
            ops/observability/alert-policy.json \
            ops/observability/prometheus/hamoon-alerts.yml

      - name: Closed-loop golden path gate
        run: uv run pytest tests/unit/operations/test_reassessment_learning_loop_golden_path.py

      - name: Docker Compose contract
        run: docker compose config --quiet

      - name: Diagnosis evaluation replay gate
        run: |
          uv run python -m hamoon.evaluation.diagnosis \
            --dataset evaluation/diagnosis/v1/dataset.json \
            --outputs evaluation/diagnosis/v1/replay_outputs.json \
            --policy evaluation/diagnosis/v1/policy.json \
            --report /tmp/diagnosis-evaluation-report.json
          uv run python -c 'import json; r=json.load(open("/tmp/diagnosis-evaluation-report.json")); assert r["structural_gate_passed"] is True'

      - name: Outcome evaluation replay gate
        run: |
          uv run python -m hamoon.evaluation.outcome \
            --dataset evaluation/outcome/v1/dataset.json \
            --outputs evaluation/outcome/v1/replay_outputs.json \
            --policy evaluation/outcome/v1/policy.json \
            --report /tmp/outcome-evaluation-report.json
          uv run python -c 'import json; r=json.load(open("/tmp/outcome-evaluation-report.json")); assert r["structural_gate_passed"] is True; assert r["grounding_coverage"] == 1.0; assert r["unsupported_ref_rate"] == 0.0'

      - name: Alembic topology
        run: uv run alembic heads

  integration:
    needs: [quality, frontend-quality]
    runs-on: ubuntu-latest
    env:
      HAMOON_DATABASE_URL: postgresql+asyncpg://hamoon:hamoon@localhost:5432/hamoon
      HAMOON_NATS_URL: nats://localhost:4222
      HAMOON_EVIDENCE_STORAGE_BACKEND: s3
      HAMOON_EVIDENCE_S3_ENDPOINT: http://localhost:9000
      HAMOON_EVIDENCE_S3_ACCESS_KEY: minio
      HAMOON_EVIDENCE_S3_SECRET_KEY: minio12345
      HAMOON_EVIDENCE_S3_BUCKET: hamoon-evidence
      HAMOON_OTEL_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Start local integration infrastructure
        run: docker compose up -d postgres nats minio minio-init

      - name: Wait for PostgreSQL and NATS
        run: |
          postgres_ready_count=0
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -U hamoon -d hamoon >/dev/null 2>&1; then
              postgres_ready_count=$((postgres_ready_count + 1))
              if [ "$postgres_ready_count" -ge 5 ]; then
                break
              fi
            else
              postgres_ready_count=0
            fi
            sleep 1
          done
          test "$postgres_ready_count" -ge 5
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8222/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          docker compose exec -T postgres pg_isready -U hamoon -d hamoon
          curl --fail --silent http://localhost:8222/healthz

          for i in {1..60}; do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:9000/minio/health/live >/dev/null
          for i in {1..60}; do
            minio_init_id="$(docker compose ps -a -q minio-init)"
            if [ -n "$minio_init_id" ] && [ "$(docker inspect -f '{{.State.Status}}' "$minio_init_id")" = "exited" ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q minio-init)")" = "0"

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Infrastructure integration tests
        run: uv run pytest tests/integration

      - name: Stop local integration infrastructure
        if: always()
        run: docker compose down -v


  release-artifact:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAMOON_API_IMAGE: hamoon-api:${{ github.sha }}
      HAMOON_WEB_IMAGE: hamoon-web:${{ github.sha }}
      HAMOON_DEPLOYMENT_ID: release-smoke-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build immutable backend image once
        run: |
          app_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build --pull \
            --build-arg HAMOON_APPLICATION_VERSION="$app_version" \
            --build-arg HAMOON_GIT_COMMIT="$GITHUB_SHA" \
            -t "$HAMOON_API_IMAGE" .
          test "$(docker image inspect "$HAMOON_API_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"

      - name: Build immutable frontend image once
        run: |
          app_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build --pull \
            --build-arg HAMOON_APPLICATION_VERSION="$app_version" \
            --build-arg HAMOON_GIT_COMMIT="$GITHUB_SHA" \
            -f frontend/Dockerfile \
            -t "$HAMOON_WEB_IMAGE" .
          test "$(docker image inspect "$HAMOON_WEB_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"

      - name: Export exact application image IDs
        run: |
          echo "HAMOON_API_IMAGE_ID=$(docker image inspect "$HAMOON_API_IMAGE" --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "HAMOON_WEB_IMAGE_ID=$(docker image inspect "$HAMOON_WEB_IMAGE" --format '{{.Id}}')" >> "$GITHUB_ENV"

      - name: Backend image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.HAMOON_API_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Frontend image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.HAMOON_WEB_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Prepare release metadata directory
        run: mkdir -p release

      - name: Generate backend CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.HAMOON_API_IMAGE }}
          format: cyclonedx
          output: release/hamoon-api.cdx.json
          exit-code: "0"
          scanners: vuln

      - name: Generate frontend CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.HAMOON_WEB_IMAGE }}
          format: cyclonedx
          output: release/hamoon-web.cdx.json
          exit-code: "0"
          scanners: vuln

      - name: Build local-only MinIO helper
        run: docker compose build minio

      - name: Start complete stack from scanned images
        run: docker compose up -d --no-build

      - name: Wait for local services
        run: |
          for i in {1..120}; do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/health/live
          curl --fail --silent http://localhost:8000/health/ready
          curl --fail --silent http://localhost:8000/health/release > /tmp/hamoon-release-health.json
          python3 - <<'PY'
          import json
          import os

          payload = json.load(open("/tmp/hamoon-release-health.json"))
          assert payload["status"] == "ready"
          assert payload["git_commit"] == os.environ["GITHUB_SHA"]
          assert payload["image_id"] == os.environ["HAMOON_API_IMAGE_ID"]
          assert payload["deployment_id"] == os.environ["HAMOON_DEPLOYMENT_ID"]
          assert payload["database_migration_versions"]
          PY

          for i in {1..120}; do
            if curl --fail --silent http://localhost:8081/realms/hamoon-local/.well-known/openid-configuration >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8081/realms/hamoon-local/.well-known/openid-configuration >/dev/null
          curl --fail --silent http://localhost:9000/minio/health/live >/dev/null
          curl --fail --silent http://localhost:8222/healthz >/dev/null

          for i in {1..60}; do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/ | grep 'id="root"'
          curl --fail --silent http://localhost:3000/auth/callback | grep 'id="root"'
          curl --fail --silent http://localhost:3000/release.json > /tmp/hamoon-web-release.json
          python3 - <<'PY'
          import json
          import os

          payload = json.load(open("/tmp/hamoon-web-release.json"))
          assert payload["git_commit"] == os.environ["GITHUB_SHA"]
          assert payload["image_id"] == os.environ["HAMOON_WEB_IMAGE_ID"]
          assert payload["deployment_id"] == os.environ["HAMOON_DEPLOYMENT_ID"]
          PY
          expected_oidc_b64="$(printf '%s' 'http://localhost:8081/realms/hamoon-local' | base64 | tr -d '\n')"
          curl --fail --silent http://localhost:3000/config.js | grep "$expected_oidc_b64"
          curl --fail --silent http://localhost:3000/health/ready >/dev/null

      - name: Verify workers, bootstrap and exact artifact identity
        run: |
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q migrate)")" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q minio-init)")" = "0"
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -q outbox-worker)")" = "true"
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -q temporal-worker)")" = "true"

          for i in {1..45}; do
            metrics="$(curl --fail --silent http://localhost:8000/metrics || true)"
            if echo "$metrics" | grep -q 'hamoon_worker_healthy{worker="outbox-worker"} 1.0' \
              && echo "$metrics" | grep -q 'hamoon_worker_healthy{worker="temporal-worker"} 1.0'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/metrics | grep 'hamoon_dependency_health{dependency="postgresql"} 1.0'
          curl --fail --silent http://localhost:8000/metrics | grep 'hamoon_outbox_pending_count'
          curl --fail --silent http://localhost:8000/metrics | grep 'hamoon_outbox_oldest_age_seconds'
          curl --fail --silent http://localhost:8000/metrics | grep 'hamoon_worker_healthy{worker="outbox-worker"} 1.0'
          curl --fail --silent http://localhost:8000/metrics | grep 'hamoon_worker_healthy{worker="temporal-worker"} 1.0'

          expected_api_id="$(docker image inspect "$HAMOON_API_IMAGE" --format '{{.Id}}')"
          for service in migrate api outbox-worker temporal-worker; do
            container_id="$(docker compose ps -a -q "$service")"
            test -n "$container_id"
            actual_id="$(docker inspect -f '{{.Image}}' "$container_id")"
            test "$actual_id" = "$expected_api_id"
          done

          expected_web_id="$(docker image inspect "$HAMOON_WEB_IMAGE" --format '{{.Id}}')"
          web_container_id="$(docker compose ps -q web)"
          test -n "$web_container_id"
          test "$(docker inspect -f '{{.Image}}' "$web_container_id")" = "$expected_web_id"

      - name: Show local stack diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Stop complete local stack
        if: always()
        run: docker compose down -v

      - name: Package immutable release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save "$HAMOON_API_IMAGE" -o release/hamoon-api.tar
          docker save "$HAMOON_WEB_IMAGE" -o release/hamoon-web.tar

          api_id="$(docker image inspect "$HAMOON_API_IMAGE" --format '{{.Id}}')"
          web_id="$(docker image inspect "$HAMOON_WEB_IMAGE" --format '{{.Id}}')"
          api_archive_sha256="$(sha256sum release/hamoon-api.tar | awk '{print $1}')"
          web_archive_sha256="$(sha256sum release/hamoon-web.tar | awk '{print $1}')"
          api_sbom_sha256="$(sha256sum release/hamoon-api.cdx.json | awk '{print $1}')"
          web_sbom_sha256="$(sha256sum release/hamoon-web.cdx.json | awk '{print $1}')"

          cat > release/provenance.json <<EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              {"name": "hamoon-api.tar", "digest": {"sha256": "${api_archive_sha256}"}},
              {"name": "hamoon-web.tar", "digest": {"sha256": "${web_archive_sha256}"}}
            ],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml#release-artifact",
                "externalParameters": {
                  "repository": "${GITHUB_REPOSITORY}",
                  "commit_sha": "${GITHUB_SHA}"
                },
                "resolvedDependencies": [
                  {
                    "uri": "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}",
                    "digest": {"gitCommit": "${GITHUB_SHA}"}
                  }
                ]
              },
              "runDetails": {
                "builder": {
                  "id": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
                },
                "metadata": {
                  "invocationId": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                }
              }
            }
          }
          EOF

          provenance_sha256="$(sha256sum release/provenance.json | awk '{print $1}')"

          cat > release/manifest.json <<EOF
          {
            "schema_version": 2,
            "repository": "${GITHUB_REPOSITORY}",
            "commit_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "backend": {
              "image": "${HAMOON_API_IMAGE}",
              "image_id": "${api_id}",
              "archive": "hamoon-api.tar",
              "archive_sha256": "${api_archive_sha256}",
              "sbom": "hamoon-api.cdx.json",
              "sbom_sha256": "${api_sbom_sha256}"
            },
            "frontend": {
              "image": "${HAMOON_WEB_IMAGE}",
              "image_id": "${web_id}",
              "archive": "hamoon-web.tar",
              "archive_sha256": "${web_archive_sha256}",
              "sbom": "hamoon-web.cdx.json",
              "sbom_sha256": "${web_sbom_sha256}"
            },
            "provenance": "provenance.json",
            "provenance_sha256": "${provenance_sha256}"
          }
          EOF

          sha256sum             release/hamoon-api.tar             release/hamoon-web.tar             release/hamoon-api.cdx.json             release/hamoon-web.cdx.json             release/provenance.json             > release/SHA256SUMS

      - name: Verify release bundle integrity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/verify_release_bundle.py release

      - name: Upload immutable release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamoon-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
