name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright src

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Contract tests
        run: uv run pytest tests/contract

      - name: Security regression gate
        run: |
          uv run pytest tests/unit/security
          uv run pytest tests/unit/provider_result/test_provider_result.py

      - name: Closed-loop golden path gate
        run: uv run pytest tests/unit/operations/test_reassessment_learning_loop_golden_path.py

      - name: Docker Compose contract
        run: docker compose config --quiet

      - name: Diagnosis evaluation replay gate
        run: |
          uv run python -m hamoon.evaluation.diagnosis \
            --dataset evaluation/diagnosis/v1/dataset.json \
            --outputs evaluation/diagnosis/v1/replay_outputs.json \
            --policy evaluation/diagnosis/v1/policy.json \
            --report /tmp/diagnosis-evaluation-report.json
          uv run python -c 'import json; r=json.load(open("/tmp/diagnosis-evaluation-report.json")); assert r["structural_gate_passed"] is True'

      - name: Outcome evaluation replay gate
        run: |
          uv run python -m hamoon.evaluation.outcome \
            --dataset evaluation/outcome/v1/dataset.json \
            --outputs evaluation/outcome/v1/replay_outputs.json \
            --policy evaluation/outcome/v1/policy.json \
            --report /tmp/outcome-evaluation-report.json
          uv run python -c 'import json; r=json.load(open("/tmp/outcome-evaluation-report.json")); assert r["structural_gate_passed"] is True; assert r["grounding_coverage"] == 1.0; assert r["unsupported_ref_rate"] == 0.0'

      - name: Alembic topology
        run: uv run alembic heads

      - name: Container build
        run: docker build -t hamoon-ci .


  integration:
    needs: quality
    runs-on: ubuntu-latest
    env:
      HAMOON_DATABASE_URL: postgresql+asyncpg://hamoon:hamoon@localhost:5432/hamoon
      HAMOON_NATS_URL: nats://localhost:4222
      HAMOON_OTEL_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Start local integration infrastructure
        run: docker compose up -d postgres nats

      - name: Wait for PostgreSQL and NATS
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U hamoon -d hamoon >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8222/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          docker compose exec -T postgres pg_isready -U hamoon -d hamoon
          curl --fail --silent http://localhost:8222/healthz

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Infrastructure integration tests
        run: uv run pytest tests/integration

      - name: Stop local integration infrastructure
        if: always()
        run: docker compose down -v
