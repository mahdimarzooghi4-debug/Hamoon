name: Stage Admission

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  stage-admission:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROMOTED_SHA: ${{ github.event.workflow_run.head_sha }}
      HAMOON_DEPLOYMENT_ID: stage-admission-${{ github.run_id }}
      HAMOON_METRICS_ACCESS_TOKEN: stage-admission-monitoring-${{ github.run_id }}-token

    steps:
      - name: Checkout exact promoted commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download immutable release bundle from source CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PROMOTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "hamoon-release-$PROMOTED_SHA" \
            --dir stage-release

      - name: Verify release bundle before Stage admission
        run: python3 scripts/verify_release_bundle.py stage-release

      - name: Bind Stage admission to source run and commit
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PROMOTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("stage-release/manifest.json").read_text())
          assert manifest["commit_sha"] == os.environ["PROMOTED_SHA"]
          assert manifest["workflow_run_id"] == os.environ["SOURCE_RUN_ID"]
          PY

      - name: Load promoted application images without rebuild
        run: |
          docker load -i stage-release/hamoon-api.tar
          docker load -i stage-release/hamoon-web.tar

          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          manifest = json.loads(Path("stage-release/manifest.json").read_text())
          print(f'HAMOON_API_IMAGE={manifest["backend"]["image"]}')
          print(f'HAMOON_WEB_IMAGE={manifest["frontend"]["image"]}')
          print(f'HAMOON_API_IMAGE_ID={manifest["backend"]["image_id"]}')
          print(f'HAMOON_WEB_IMAGE_ID={manifest["frontend"]["image_id"]}')
          PY

      - name: Verify loaded image identity against release manifest
        run: |
          expected_api_id="$(python3 -c 'import json; print(json.load(open("stage-release/manifest.json"))["backend"]["image_id"])')"
          expected_web_id="$(python3 -c 'import json; print(json.load(open("stage-release/manifest.json"))["frontend"]["image_id"])')"
          test "$(docker image inspect "$HAMOON_API_IMAGE" --format '{{.Id}}')" = "$expected_api_id"
          test "$(docker image inspect "$HAMOON_WEB_IMAGE" --format '{{.Id}}')" = "$expected_web_id"

      - name: Build Stage-admission-only dependency helper
        run: docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml build minio

      - name: Prepare Stage telemetry capture
        run: |
          rm -rf .stage-otel
          mkdir -p .stage-otel
          chmod a+rwx .stage-otel
          docker run --rm \
            -v "$PWD/ops/observability/otel-collector-stage.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.161.0 \
            validate --config=/etc/otelcol-contrib/config.yaml

      - name: Start clean Stage-admission stack from promoted images
        run: docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml up -d --no-build

      - name: Stage smoke and E2E boundary
        run: |
          for i in {1..120}; do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/health/live
          curl --fail --silent http://localhost:8000/health/ready
          curl --fail --silent http://localhost:8000/health/release > /tmp/hamoon-stage-release-health.json
          python3 - <<'PY'
          import json
          import os

          payload = json.load(open("/tmp/hamoon-stage-release-health.json"))
          assert payload["status"] == "ready"
          assert payload["environment"] == "stage"
          assert payload["git_commit"] == os.environ["PROMOTED_SHA"]
          assert payload["image_id"] == os.environ["HAMOON_API_IMAGE_ID"]
          assert payload["deployment_id"] == os.environ["HAMOON_DEPLOYMENT_ID"]
          assert payload["database_migration_versions"]
          PY

          for i in {1..120}; do
            if curl --fail --silent http://localhost:8081/realms/hamoon-local/.well-known/openid-configuration >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8081/realms/hamoon-local/.well-known/openid-configuration >/dev/null
          curl --fail --silent http://localhost:9000/minio/health/live >/dev/null
          curl --fail --silent http://localhost:8222/healthz >/dev/null

          for i in {1..60}; do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/ | grep 'id="root"'
          curl --fail --silent http://localhost:3000/auth/callback | grep 'id="root"'
          curl --fail --silent http://localhost:3000/release.json > /tmp/hamoon-stage-web-release.json
          python3 - <<'PY'
          import json
          import os

          payload = json.load(open("/tmp/hamoon-stage-web-release.json"))
          assert payload["git_commit"] == os.environ["PROMOTED_SHA"]
          assert payload["image_id"] == os.environ["HAMOON_WEB_IMAGE_ID"]
          assert payload["deployment_id"] == os.environ["HAMOON_DEPLOYMENT_ID"]
          PY
          curl --fail --silent http://localhost:3000/health/ready >/dev/null

          curl --fail --silent --request POST \
            --header "X-Hamoon-Metrics-Token: $HAMOON_METRICS_ACCESS_TOKEN" \
            http://localhost:8000/health/telemetry-probe \
            > /tmp/hamoon-telemetry-probe.json

          python3 - <<'PY'
          import json

          payload = json.load(open("/tmp/hamoon-telemetry-probe.json"))
          assert payload["status"] == "emitted"
          assert payload["environment"] == "stage"
          assert payload["probe_id"].startswith("hamoon-otel-")
          assert len(payload["trace_id"]) == 32
          PY
          TELEMETRY_PROBE_ID="$(
            python3 -c 'import json; print(json.load(open("/tmp/hamoon-telemetry-probe.json"))["probe_id"])'
          )"
          TELEMETRY_PROBE_TRACE_ID="$(
            python3 -c 'import json; print(json.load(open("/tmp/hamoon-telemetry-probe.json"))["trace_id"])'
          )"
          export TELEMETRY_PROBE_ID TELEMETRY_PROBE_TRACE_ID

          for i in {1..30}; do
            if grep -q "$TELEMETRY_PROBE_ID" .stage-otel/traces.json 2>/dev/null \
              && grep -q "$TELEMETRY_PROBE_ID" .stage-otel/logs.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          grep "$TELEMETRY_PROBE_ID" .stage-otel/traces.json
          grep "$TELEMETRY_PROBE_ID" .stage-otel/logs.json
          grep "$PROMOTED_SHA" .stage-otel/traces.json
          grep "$PROMOTED_SHA" .stage-otel/logs.json
          grep "$HAMOON_DEPLOYMENT_ID" .stage-otel/traces.json
          grep "$HAMOON_DEPLOYMENT_ID" .stage-otel/logs.json
          grep "Observability verification probe emitted" .stage-otel/logs.json
          ! grep -q "$HAMOON_METRICS_ACCESS_TOKEN" .stage-otel/logs.json

          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml ps -a -q migrate)")" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml ps -a -q minio-init)")" = "0"
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml ps -q outbox-worker)")" = "true"
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml ps -q temporal-worker)")" = "true"
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml ps -q provider-worker)")" = "true"

          for i in {1..45}; do
            metrics="$(curl --fail --silent --header "X-Hamoon-Metrics-Token: $HAMOON_METRICS_ACCESS_TOKEN" http://localhost:8000/metrics || true)"
            if echo "$metrics" | grep -q 'hamoon_worker_healthy{worker="outbox-worker"} 1.0' \
              && echo "$metrics" | grep -q 'hamoon_worker_healthy{worker="temporal-worker"} 1.0' \
              && echo "$metrics" | grep -q 'hamoon_worker_healthy{worker="provider-worker"} 1.0'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --header "X-Hamoon-Metrics-Token: $HAMOON_METRICS_ACCESS_TOKEN" http://localhost:8000/metrics | grep 'hamoon_dependency_health{dependency="postgresql"} 1.0'
          curl --fail --silent --header "X-Hamoon-Metrics-Token: $HAMOON_METRICS_ACCESS_TOKEN" http://localhost:8000/metrics | grep 'hamoon_outbox_pending_count'
          curl --fail --silent --header "X-Hamoon-Metrics-Token: $HAMOON_METRICS_ACCESS_TOKEN" http://localhost:8000/metrics | grep 'hamoon_outbox_oldest_age_seconds'
          curl --fail --silent --header "X-Hamoon-Metrics-Token: $HAMOON_METRICS_ACCESS_TOKEN" http://localhost:8000/metrics | grep 'hamoon_worker_healthy{worker="outbox-worker"} 1.0'
          curl --fail --silent --header "X-Hamoon-Metrics-Token: $HAMOON_METRICS_ACCESS_TOKEN" http://localhost:8000/metrics | grep 'hamoon_worker_healthy{worker="temporal-worker"} 1.0'
          curl --fail --silent --header "X-Hamoon-Metrics-Token: $HAMOON_METRICS_ACCESS_TOKEN" http://localhost:8000/metrics | grep 'hamoon_worker_healthy{worker="provider-worker"} 1.0'

      - name: Verify exact promoted images are running
        run: |
          expected_api_id="$(docker image inspect "$HAMOON_API_IMAGE" --format '{{.Id}}')"
          for service in migrate api outbox-worker temporal-worker provider-worker; do
            container_id="$(docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml ps -a -q "$service")"
            test -n "$container_id"
            test "$(docker inspect -f '{{.Image}}' "$container_id")" = "$expected_api_id"
          done

          expected_web_id="$(docker image inspect "$HAMOON_WEB_IMAGE" --format '{{.Id}}')"
          web_container_id="$(docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml ps -q web)"
          test -n "$web_container_id"
          test "$(docker inspect -f '{{.Image}}' "$web_container_id")" = "$expected_web_id"

      - name: Create Stage admission attestation
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PROMOTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p stage-attestation
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          release_dir = Path("stage-release")
          manifest = json.loads((release_dir / "manifest.json").read_text())
          manifest_sha256 = hashlib.sha256(
              (release_dir / "manifest.json").read_bytes()
          ).hexdigest()

          attestation = {
              "schema_version": 1,
              "status": "PASSED",
              "environment_class": "STAGE_ADMISSION",
              "hosted_stage": False,
              "commit_sha": os.environ["PROMOTED_SHA"],
              "source_ci_run_id": os.environ["SOURCE_RUN_ID"],
              "stage_admission_run_id": os.environ["GITHUB_RUN_ID"],
              "release_manifest_sha256": manifest_sha256,
              "backend_image_id": manifest["backend"]["image_id"],
              "frontend_image_id": manifest["frontend"]["image_id"],
              "verified_at": datetime.now(UTC).isoformat(),
          }
          Path("stage-attestation/stage-attestation.json").write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify Stage admission attestation
        run: python3 scripts/verify_stage_attestation.py stage-release stage-attestation/stage-attestation.json

      - name: Upload Stage admission attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamoon-stage-admission-${{ github.event.workflow_run.head_sha }}
          path: stage-attestation/
          if-no-files-found: error
          retention-days: 30

      - name: Show Stage admission diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml ps
          docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml logs --no-color --tail=200

      - name: Stop Stage admission stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.stage-admission.yml down -v
