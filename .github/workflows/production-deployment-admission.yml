name: Production Deployment Admission

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact approved 40-character commit SHA
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to admit this release to the Production target
        required: true
        type: string
      production_target:
        description: Stable Production target identifier
        required: true
        type: string
      production_endpoint:
        description: Public HTTPS Production endpoint
        required: true
        type: string
      deployment_id:
        description: Expected runtime deployment identifier
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  admit-production-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMOTED_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Validate explicit deployment admission input
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOYER: ${{ github.actor }}
          PRODUCTION_TARGET: ${{ inputs.production_target }}
          PRODUCTION_ENDPOINT: ${{ inputs.production_endpoint }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          test "$CONFIRMATION" = "DEPLOY"
          printf '%s' "$PROMOTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$DEPLOYER"
          case "$DEPLOYER" in
            *"[bot]") echo "bot identities cannot admit Production deployment"; exit 1 ;;
          esac
          test -n "$PRODUCTION_TARGET"
          printf '%s' "$DEPLOYMENT_ID" | grep -Eq '^[A-Za-z0-9._:-]{1,128}$'
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          endpoint = os.environ["PRODUCTION_ENDPOINT"].strip()
          parsed = urlsplit(endpoint)
          assert parsed.scheme == "https", "Production endpoint must use HTTPS"
          assert parsed.hostname, "Production endpoint must include a host"
          host = parsed.hostname.lower()
          assert host not in {"localhost", "127.0.0.1", "0.0.0.0", "::1", "::"}
          assert not host.endswith(".localhost")
          PY

      - name: Checkout exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Require candidate to belong to main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$PROMOTED_SHA" origin/main

      - name: Resolve immutable Production Operational Readiness artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          readiness_name="hamoon-production-operational-readiness-$PROMOTED_SHA"
          readiness_artifact_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$readiness_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)][0].id'
          )"
          test -n "$readiness_artifact_id"

          readiness_run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$readiness_artifact_id" \
              --jq '.workflow_run.id'
          )"
          test -n "$readiness_run_id"

          readiness_conclusion="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$readiness_run_id" \
              --jq '.conclusion'
          )"
          test "$readiness_conclusion" = "success"
          echo "OPERATIONAL_READINESS_RUN_ID=$readiness_run_id" >> "$GITHUB_ENV"

      - name: Download Production Operational Readiness artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p admission-input/readiness
          gh run download "$OPERATIONAL_READINESS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "hamoon-production-operational-readiness-$PROMOTED_SHA" \
            --dir admission-input/readiness

      - name: Resolve immutable Release Approval artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          approval_name="hamoon-release-approval-$PROMOTED_SHA"
          approval_artifact_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$approval_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)][0].id'
          )"
          test -n "$approval_artifact_id"

          approval_run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$approval_artifact_id" \
              --jq '.workflow_run.id'
          )"
          test -n "$approval_run_id"

          approval_conclusion="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$approval_run_id" \
              --jq '.conclusion'
          )"
          test "$approval_conclusion" = "success"

          echo "RELEASE_APPROVAL_RUN_ID=$approval_run_id" >> "$GITHUB_ENV"

      - name: Download Release Approval artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p admission-input/approval
          gh run download "$RELEASE_APPROVAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "hamoon-release-approval-$PROMOTED_SHA" \
            --dir admission-input/approval

      - name: Resolve evidence chain from approval
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          approval = json.loads(
              Path("admission-input/approval/release-approval.json").read_text()
          )
          print(f'SOURCE_CI_RUN_ID={approval["source_ci_run_id"]}')
          print(f'STAGE_ADMISSION_RUN_ID={approval["stage_admission_run_id"]}')
          PY

      - name: Download exact Stage and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p admission-input/stage admission-input/release
          gh run download "$STAGE_ADMISSION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "hamoon-stage-admission-$PROMOTED_SHA" \
            --dir admission-input/stage
          gh run download "$SOURCE_CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "hamoon-release-$PROMOTED_SHA" \
            --dir admission-input/release

      - name: Re-verify the complete release governance chain
        run: |
          python3 scripts/verify_release_bundle.py admission-input/release
          python3 scripts/verify_stage_attestation.py \
            admission-input/release \
            admission-input/stage/stage-attestation.json
          python3 scripts/verify_release_approval.py \
            admission-input/release \
            admission-input/stage/stage-attestation.json \
            admission-input/approval/release-approval.json

      - name: Create Production deployment admission
        env:
          DEPLOYER: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ADMISSION_RUN_ID: ${{ github.run_id }}
          PRODUCTION_TARGET: ${{ inputs.production_target }}
          PRODUCTION_ENDPOINT: ${{ inputs.production_endpoint }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          mkdir -p production-admission
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          release_manifest_path = Path("admission-input/release/manifest.json")
          stage_path = Path("admission-input/stage/stage-attestation.json")
          approval_path = Path("admission-input/approval/release-approval.json")
          readiness_path = Path(
              "admission-input/readiness/production-operational-readiness.json"
          )

          manifest = json.loads(release_manifest_path.read_text())
          stage = json.loads(stage_path.read_text())
          approval = json.loads(approval_path.read_text())
          readiness = json.loads(readiness_path.read_text())

          admission = {
              "schema_version": 1,
              "status": "ADMITTED",
              "admission_scope": "PRODUCTION_DEPLOYMENT",
              "production_deployed": False,
              "commit_sha": os.environ["PROMOTED_SHA"],
              "source_ci_run_id": os.environ["SOURCE_CI_RUN_ID"],
              "stage_admission_run_id": os.environ["STAGE_ADMISSION_RUN_ID"],
              "release_approval_run_id": os.environ["RELEASE_APPROVAL_RUN_ID"],
              "operational_readiness_run_id": os.environ[
                  "OPERATIONAL_READINESS_RUN_ID"
              ],
              "deployment_admission_run_id": os.environ["ADMISSION_RUN_ID"],
              "release_manifest_sha256": hashlib.sha256(
                  release_manifest_path.read_bytes()
              ).hexdigest(),
              "stage_attestation_sha256": hashlib.sha256(
                  stage_path.read_bytes()
              ).hexdigest(),
              "release_approval_sha256": hashlib.sha256(
                  approval_path.read_bytes()
              ).hexdigest(),
              "operational_readiness_sha256": hashlib.sha256(
                  readiness_path.read_bytes()
              ).hexdigest(),
              "operational_readiness_status": readiness["status"],
              "backend_image_id": manifest["backend"]["image_id"],
              "frontend_image_id": manifest["frontend"]["image_id"],
              "release_approver": approval["approver"],
              "deployer": os.environ["DEPLOYER"],
              "triggering_actor": os.environ["TRIGGERING_ACTOR"],
              "change_reference": approval["change_reference"],
              "production_target": os.environ["PRODUCTION_TARGET"].strip(),
              "production_endpoint": os.environ["PRODUCTION_ENDPOINT"].strip(),
              "expected_deployment_id": os.environ["DEPLOYMENT_ID"].strip(),
              "stage_status": stage["status"],
              "release_approval_status": approval["status"],
              "admitted_at": datetime.now(UTC).isoformat(),
          }
          Path(
              "production-admission/production-deployment-admission.json"
          ).write_text(
              json.dumps(admission, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify Production deployment admission
        run: |
          python3 scripts/verify_production_deployment_admission.py \
            admission-input/release \
            admission-input/stage/stage-attestation.json \
            admission-input/approval/release-approval.json \
            admission-input/readiness/production-operational-readiness.json \
            production-admission/production-deployment-admission.json

      - name: Upload immutable Production deployment admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamoon-production-deployment-admission-${{ inputs.commit_sha }}
          path: production-admission/
          if-no-files-found: error
          retention-days: 30
