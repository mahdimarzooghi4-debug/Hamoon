name: Native AI Diagnosis Evaluation

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character Hamoon commit SHA
        required: true
        type: string
      model_id:
        description: Native model ID
        required: true
        type: string
      model_artifact_sha256:
        description: Exact SHA-256 of the local Hamoon model artifact
        required: true
        type: string
      confirmation:
        description: Type EVALUATE_NATIVE_AI
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnosis-evaluation:
    runs-on: self-hosted
    timeout-minutes: 30
    environment: ai-evaluation
    env:
      PROMOTED_SHA: ${{ inputs.commit_sha }}
      HAMOON_AI_MODEL_ROOT: ${{ vars.HAMOON_AI_MODEL_ROOT }}

    steps:
      - name: Validate native evaluation input
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODEL_ARTIFACT_SHA256: ${{ inputs.model_artifact_sha256 }}
        run: |
          test "$CONFIRMATION" = "EVALUATE_NATIVE_AI"
          printf '%s' "$PROMOTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$MODEL_ARTIFACT_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          test -n "$HAMOON_AI_MODEL_ROOT"
          test -f "$HAMOON_AI_MODEL_ROOT/$MODEL_ARTIFACT_SHA256.json"

      - name: Checkout exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Require candidate to belong to main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$PROMOTED_SHA" origin/main

      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run native candidate evaluation
        run: |
          uv run python -m hamoon.evaluation.diagnosis_candidate \
            --dataset evaluation/diagnosis/v1/dataset.json \
            --policy evaluation/diagnosis/v1/policy.json \
            --instructions evaluation/diagnosis/v1/instructions.txt \
            --model-id "${{ inputs.model_id }}" \
            --model-artifact-sha256 "${{ inputs.model_artifact_sha256 }}" \
            --outputs artifacts/diagnosis-candidate-outputs.json \
            --report artifacts/diagnosis-evaluation-report.json

      - name: Write immutable native evaluation identity
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          outputs = Path("artifacts/diagnosis-candidate-outputs.json")
          report = Path("artifacts/diagnosis-evaluation-report.json")
          identity = {
              "schema_version": 1,
              "provider_code": "HAMOON_NATIVE",
              "commit_sha": os.environ["PROMOTED_SHA"],
              "model_id": "${{ inputs.model_id }}",
              "model_artifact_sha256": "${{ inputs.model_artifact_sha256 }}",
              "outputs_sha256": hashlib.sha256(outputs.read_bytes()).hexdigest(),
              "report_sha256": hashlib.sha256(report.read_bytes()).hexdigest(),
          }
          Path("artifacts/native-evaluation-identity.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-diagnosis-evaluation-${{ inputs.model_artifact_sha256 }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
